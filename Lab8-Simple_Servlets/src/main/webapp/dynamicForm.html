<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dynamic Content Example</title>
</head>
<body>
    <h2>Enter Your Name and Favorite Color</h2>
    <form action="dynamicContent" method="get">
        <label for="username">Name:</label><br>
        <input type="text" id="username" name="username" required><br><br>

        <label for="color">Background Color:</label><br>
        <input type="text" id="color" name="color" placeholder="e.g., red, green, blue" required><br><br>

        <input type="submit" value="Show Greeting">
    </form>
</body>
</html>
